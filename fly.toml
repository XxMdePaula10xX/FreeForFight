# Fly.io deploy. WebSocket-friendly on the free tier (persistent connection).
# `fly launch` will fill in an app name; keep the internal port at 8787.
app = "octogono"
primary_region = "gru" # São Paulo — close to the intended players

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  NODE_ENV = "production"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
