# Codemagic CI — build the Octógono iOS app from the Capacitor web client and
# ship it to TestFlight. Configure signing + App Store Connect in the Codemagic
# UI (groups referenced below). See README "Empacotar para a App Store".

workflows:
  ios-capacitor:
    name: Octógono iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_connect # APP_STORE_CONNECT_* + signing (set in Codemagic UI)
      vars:
        BUNDLE_ID: 'com.matheus.octogono'
        XCODE_WORKSPACE: 'client/ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
        # Point the packaged app at your deployed server for ONLINE play.
        # Leave empty to ship a solo-only build (works fully offline).
        VITE_WS_URL: 'wss://octogono.fly.dev'
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web client
        script: |
          cd client
          VITE_WS_URL="$VITE_WS_URL" npm run build
      - name: Add iOS platform & sync
        script: |
          cd client
          npx cap add ios || true
          npx cap sync ios
      - name: Generate icons & splash
        script: |
          cd client
          npx @capacitor/assets generate --ios || echo "assets step skipped"
      - name: Install CocoaPods
        script: |
          cd client/ios/App
          pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # No Mac, no Apple account needed — Android builds anywhere (Linux instance).
  android-capacitor:
    name: Octógono Android (Capacitor)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      groups:
        - google_play # CM_KEYSTORE*, GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Codemagic UI)
      vars:
        PACKAGE_NAME: 'com.matheus.octogono'
        VITE_WS_URL: 'wss://octogono.fly.dev' # empty = solo-only (offline) build
      node: 20
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web client
        script: |
          cd client
          VITE_WS_URL="$VITE_WS_URL" npm run build
      - name: Add Android platform & sync
        script: |
          cd client
          npx cap add android || true
          npx cap sync android
      - name: Set up keystore (release signing)
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/client/android/app/release.keystore" || true
      - name: Build release AAB
        script: |
          cd client/android
          ./gradlew bundleRelease
    artifacts:
      - client/android/app/build/outputs/**/*.aab
      - client/android/app/build/outputs/**/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
