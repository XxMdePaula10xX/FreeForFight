<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Octógono — protótipo local</title>
<style>
  :root {
    --void: #0d0b0f;
    --tatame: #1c1a24;
    --marca: #f5f2e8;
    --perigo: #ff4d2e;
    --reflexo: #4dd8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--void); overflow: hidden;
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; color: var(--marca); }
  #stage { position: fixed; inset: 0; display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; pointer-events: none; }
  #panel { pointer-events: auto; background: rgba(13,11,15,0.86); border: 2px solid rgba(245,242,232,0.15);
    border-radius: 14px; padding: 28px 34px; max-width: 560px; }
  h1 { font-family: 'Archivo Black', system-ui, sans-serif; font-weight: 900; letter-spacing: -0.02em;
    text-transform: uppercase; font-size: clamp(28px, 6vw, 52px); line-height: 0.95; }
  h1 .sub { display: block; color: var(--perigo); font-size: 0.42em; letter-spacing: 0.24em; margin-top: 6px; }
  p { margin: 12px 0; font-size: 13px; line-height: 1.5; color: #b9b4c4; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  button { pointer-events: auto; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px;
    padding: 12px 22px; border-radius: 10px; border: 2px solid var(--marca); background: transparent;
    color: var(--marca); text-transform: uppercase; letter-spacing: 0.06em; transition: transform .06s; }
  button:hover { background: var(--marca); color: var(--void); }
  button:active { transform: scale(0.96); }
  button.primary { background: var(--perigo); border-color: var(--perigo); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
  .keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 22px; text-align: left;
    margin: 16px auto 0; font-size: 12px; max-width: 460px; }
  .keys .k { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.5); flex: none; }
  kbd { background: #26232f; border: 1px solid #3a3646; border-bottom-width: 2px; border-radius: 4px;
    padding: 1px 5px; font-size: 11px; color: var(--marca); }
  .hidden { display: none !important; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 11px;
    color: #6d6880; letter-spacing: 0.05em; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="overlay">
  <div id="panel">
    <h1>Octógono<span class="sub">protótipo local</span></h1>
    <p id="msg">Sumô eletrônico. Empurre os outros pra fora. A arena encolhe.<br>
      Refletir na hora certa devolve o empurrão com juros — na hora errada te deixa parado.</p>
    <div id="keys" class="keys"></div>
    <div class="row" id="menuButtons">
      <button data-n="2">2 jogadores</button>
      <button class="primary" data-n="3">3 jogadores</button>
      <button data-n="4">4 jogadores</button>
    </div>
    <div class="row hidden" id="nextButtons">
      <button id="btnNext" class="primary">Próxima rodada</button>
    </div>
  </div>
</div>
<div id="hint">Melhor de 5 · primeiro a 3 pontos · protótipo sem rede</div>

<script type="module">
// =============================================================================
//  Octógono — protótipo local (arquivo único, 4 discos, 1 teclado, sem rede).
//  A física aqui é uma tradução fiel de shared/physics.ts. Ajuste TUNING e
//  jogue. Se não for divertido aqui, não será divertido online (PRD §12).
// =============================================================================

const TICK_RATE = 60, DT = 1 / TICK_RATE;
const msToTicks = (ms) => Math.round((ms / 1000) * TICK_RATE);

const TUNING = {
  disc: { radius: 24, mass: 1, maxSpeed: 260, accel: 1400, friction: 0.90 },
  collision: { restitution: 0.85 },
  push: { range: 90, force: 620, duration: 120, cooldown: 900, selfKnockback: 140, falloffMin: 0.4 },
  reflect: { active: 180, recovery: 320, cooldown: 1600, returnMult: 1.3, punishMult: 1.5 },
  ghost: { force: 220, range: 70, cooldown: 2500, slideSpeed: 2.6 },
  arena: { startRadius: 340, endRadius: 130, shrinkStartAt: 8000, shrinkDuration: 35000 },
  round: { countdown: 3000, maxDuration: 60000, endFreeze: 2000 },
  match: { scoreToWin: 3 },
};
const D = TUNING.disc, P = TUNING.push, R = TUNING.reflect, G = TUNING.ghost;
const PUSH_CD = msToTicks(P.cooldown), R_ACTIVE = msToTicks(R.active),
  R_RECOVERY = msToTicks(R.recovery), R_CD = msToTicks(R.cooldown),
  GHOST_CD = msToTicks(G.cooldown), SHRINK_START = msToTicks(TUNING.arena.shrinkStartAt),
  SHRINK_DUR = msToTicks(TUNING.arena.shrinkDuration), MAX_ROUND = msToTicks(TUNING.round.maxDuration),
  PUSH_ANIM = msToTicks(P.duration);

const COLORS = ['#ffd23f', '#3ddc84', '#ff6bd6', '#7c5cff'];
const NAMES = ['Amarelo', 'Verde', 'Rosa', 'Roxo'];

// event.code control map. Distinct clusters so 4 people share one keyboard.
const KEYMAP = [
  { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', push: 'Space', reflect: 'ShiftLeft',
    label: 'WASD + Espaço + Shift↲' },
  { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', push: 'Slash', reflect: 'ShiftRight',
    label: 'Setas + / + Shift↳' },
  { up: 'KeyI', down: 'KeyK', left: 'KeyJ', right: 'KeyL', push: 'KeyU', reflect: 'KeyO',
    label: 'IJKL + U + O' },
  { up: 'KeyT', down: 'KeyG', left: 'KeyF', right: 'KeyH', push: 'KeyR', reflect: 'KeyY',
    label: 'TFGH + R + Y' },
];

// ---- geometry (regular octagon, flat sides at top/bottom/left/right) --------
const EDGE_NORMALS = Array.from({ length: 8 }, (_, k) => {
  const a = (Math.PI / 4) * k; return { x: Math.cos(a), y: Math.sin(a) };
});
const APOTHEM_RATIO = Math.cos(Math.PI / 8);
const apothem = (r) => r * APOTHEM_RATIO;
function outsideDepth(p, r) {
  const a = apothem(r); let m = -Infinity;
  for (const n of EDGE_NORMALS) { const d = p.x * n.x + p.y * n.y - a; if (d > m) m = d; }
  return m;
}
function vertices(r) {
  return Array.from({ length: 8 }, (_, k) => {
    const a = Math.PI / 8 + (Math.PI / 4) * k;
    return { x: Math.cos(a) * r, y: Math.sin(a) * r };
  });
}
function boundaryDistanceAlong(u, r) {
  const a = apothem(r); let md = 0;
  for (const n of EDGE_NORMALS) { const d = u.x * n.x + u.y * n.y; if (d > md) md = d; }
  return md < 1e-9 ? r : a / md;
}
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
function normalize(a) { const l = Math.hypot(a.x, a.y); return l < 1e-9 ? { x: 0, y: 0 } : { x: a.x / l, y: a.y / l }; }

// ---- simulation state -------------------------------------------------------
let state = null;   // { tick, roundStartTick, arenaRadius, discs[] }
let inputs = [];    // per-disc { dir, push, reflect }
let match = { scores: [], playerCount: 0, roundIndex: 0 };
let fx = { rings: [], falls: [], hitstopUntilMs: 0, flash: 0 };
let phase = 'menu';  // menu | countdown | playing | round_end | match_end
let countdownEndsMs = 0, roundEndAtMs = 0, lastWinner = -1;

function makeDisc(id, pos) {
  return { id, pos: { x: pos.x, y: pos.y }, vel: { x: 0, y: 0 }, alive: true, ghost: false,
    ghostAngle: Math.atan2(pos.y, pos.x), pushCooldownUntil: 0, pushAnimUntil: 0,
    reflectState: 'idle', reflectUntil: 0, reflectCooldownUntil: 0 };
}

function arenaRadiusAt(tick, start) {
  const e = tick - start;
  if (e <= SHRINK_START) return TUNING.arena.startRadius;
  const t = (e - SHRINK_START) / SHRINK_DUR;
  return t >= 1 ? TUNING.arena.endRadius : lerp(TUNING.arena.startRadius, TUNING.arena.endRadius, t);
}

function startRound() {
  const n = match.playerCount;
  const spawnR = TUNING.arena.startRadius * 0.55;
  const discs = [];
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n - Math.PI / 2;
    discs.push(makeDisc(i, { x: Math.cos(a) * spawnR, y: Math.sin(a) * spawnR }));
  }
  state = { tick: 0, roundStartTick: 0, arenaRadius: TUNING.arena.startRadius, discs };
  inputs = Array.from({ length: n }, () => ({ dir: { x: 0, y: 0 }, push: false, reflect: false }));
  fx = { rings: [], falls: [], hitstopUntilMs: 0, flash: 0 };
  phase = 'countdown';
  countdownEndsMs = performance.now() + TUNING.round.countdown;
  showOverlay(false);
}

// ---- the deterministic tick (mirror of shared/physics.ts) -------------------
function step() {
  const events = [];
  const tick = state.tick;
  state.arenaRadius = arenaRadiusAt(tick, state.roundStartTick);

  // A. reflect/push timers
  for (const disc of state.discs) {
    if (!disc.alive || disc.ghost) continue;
    const inp = inputs[disc.id];
    if (disc.reflectState === 'active' && tick >= disc.reflectUntil) {
      disc.reflectState = 'recovery'; disc.reflectUntil = tick + R_RECOVERY;
    } else if (disc.reflectState === 'recovery' && tick >= disc.reflectUntil) {
      disc.reflectState = 'idle'; disc.reflectCooldownUntil = tick + R_CD;
    }
    if (inp.reflect && disc.reflectState === 'idle' && tick >= disc.reflectCooldownUntil) {
      disc.reflectState = 'active'; disc.reflectUntil = tick + R_ACTIVE;
    }
  }

  // B. self-propulsion
  for (const disc of state.discs) {
    if (!disc.alive || disc.ghost) continue;
    const inp = inputs[disc.id];
    if (disc.reflectState === 'active' || disc.reflectState === 'recovery') {
      disc.vel.x = 0; disc.vel.y = 0; continue;
    }
    const dir = normalize(inp.dir);
    disc.vel.x += dir.x * D.accel * DT; disc.vel.y += dir.y * D.accel * DT;
    const sp = Math.hypot(disc.vel.x, disc.vel.y);
    if (sp > D.maxSpeed) { const s = D.maxSpeed / sp; disc.vel.x *= s; disc.vel.y *= s; }
    disc.vel.x *= D.friction; disc.vel.y *= D.friction;
  }

  // C. pushes
  for (const disc of state.discs) {
    if (!disc.alive) continue;
    const inp = inputs[disc.id];
    if (disc.ghost) {
      if (inp.push && tick >= disc.pushCooldownUntil) {
        disc.pushCooldownUntil = tick + GHOST_CD; disc.pushAnimUntil = tick + PUSH_ANIM;
        for (const tgt of state.discs) {
          if (tgt === disc || !tgt.alive || tgt.ghost) continue;
          applyPushTo(disc, tgt, G.force, G.range);
        }
        events.push({ kind: 'ghostPush', pos: { ...disc.pos } });
      }
      continue;
    }
    if (!inp.push || tick < disc.pushCooldownUntil || disc.reflectState !== 'idle') continue;
    disc.pushCooldownUntil = tick + PUSH_CD; disc.pushAnimUntil = tick + PUSH_ANIM;
    events.push({ kind: 'push', pos: { ...disc.pos }, id: disc.id });
    let rx = 0, ry = 0;
    for (const tgt of state.discs) {
      if (tgt === disc || !tgt.alive || tgt.ghost) continue;
      const r = resolvePush(disc, tgt, P.force, P.range, events);
      rx -= r.x; ry -= r.y;
    }
    disc.vel.x += rx * P.selfKnockback; disc.vel.y += ry * P.selfKnockback;
  }

  // D. integrate
  for (const disc of state.discs) {
    if (!disc.alive) continue;
    if (disc.ghost) { moveGhost(disc, inputs[disc.id]); continue; }
    disc.pos.x += disc.vel.x * DT; disc.pos.y += disc.vel.y * DT;
  }

  // E. collisions
  const live = state.discs.filter((d) => d.alive && !d.ghost);
  for (let i = 0; i < live.length; i++)
    for (let j = i + 1; j < live.length; j++) collide(live[i], live[j], events);

  // F. eliminations
  for (const disc of state.discs) {
    if (!disc.alive || disc.ghost) continue;
    if (outsideDepth(disc.pos, state.arenaRadius) >= 0) {
      fx.falls.push({ pos: { ...disc.pos }, vel: { ...disc.vel }, color: COLORS[disc.id], t0: performance.now() });
      disc.ghost = true; disc.vel.x = 0; disc.vel.y = 0; disc.reflectState = 'idle';
      disc.ghostAngle = Math.atan2(disc.pos.y, disc.pos.x); disc.pushCooldownUntil = tick + GHOST_CD;
      events.push({ kind: 'eliminated', pos: { ...disc.pos }, id: disc.id });
    }
  }

  state.tick++;
  return events;
}

function resolvePush(att, tgt, baseForce, range, events) {
  const dx = tgt.pos.x - att.pos.x, dy = tgt.pos.y - att.pos.y;
  const d = Math.hypot(dx, dy), reach = range + D.radius;
  if (d > reach || d < 1e-6) return { x: 0, y: 0 };
  const nx = dx / d, ny = dy / d;
  const falloff = lerp(1, P.falloffMin, clamp(d / reach, 0, 1));
  if (tgt.reflectState === 'active') {
    const mag = baseForce * falloff * R.returnMult;
    att.vel.x -= nx * mag; att.vel.y -= ny * mag;
    events.push({ kind: 'clash', pos: { ...tgt.pos } });
    return { x: 0, y: 0 };
  }
  const mult = tgt.reflectState === 'recovery' ? R.punishMult : 1;
  const mag = baseForce * falloff * mult;
  tgt.vel.x += nx * mag; tgt.vel.y += ny * mag;
  return { x: nx * falloff, y: ny * falloff };
}
function applyPushTo(att, tgt, baseForce, range) {
  const dx = tgt.pos.x - att.pos.x, dy = tgt.pos.y - att.pos.y;
  const d = Math.hypot(dx, dy), reach = range + D.radius;
  if (d > reach || d < 1e-6) return;
  const nx = dx / d, ny = dy / d;
  const falloff = lerp(1, P.falloffMin, clamp(d / reach, 0, 1));
  const mult = tgt.reflectState === 'recovery' ? R.punishMult : 1;
  const mag = baseForce * falloff * mult;
  tgt.vel.x += nx * mag; tgt.vel.y += ny * mag;
}
function collide(a, b, events) {
  const dx = b.pos.x - a.pos.x, dy = b.pos.y - a.pos.y;
  const d = Math.hypot(dx, dy), minD = D.radius * 2;
  if (d >= minD || d < 1e-6) return;
  const nx = dx / d, ny = dy / d, overlap = (minD - d) / 2;
  a.pos.x -= nx * overlap; a.pos.y -= ny * overlap;
  b.pos.x += nx * overlap; b.pos.y += ny * overlap;
  const relVel = (b.vel.x - a.vel.x) * nx + (b.vel.y - a.vel.y) * ny;
  if (relVel > 0) return;
  const j = -(1 + TUNING.collision.restitution) * relVel / 2;
  a.vel.x -= nx * j; a.vel.y -= ny * j; b.vel.x += nx * j; b.vel.y += ny * j;
  if (j > 220) events.push({ kind: 'clash', pos: { x: a.pos.x + nx * D.radius, y: a.pos.y + ny * D.radius } });
}
function moveGhost(disc, inp) {
  const t = { x: -Math.sin(disc.ghostAngle), y: Math.cos(disc.ghostAngle) };
  const drive = inp.dir.x * t.x + inp.dir.y * t.y;
  disc.ghostAngle += drive * G.slideSpeed * DT;
  const u = { x: Math.cos(disc.ghostAngle), y: Math.sin(disc.ghostAngle) };
  const r = boundaryDistanceAlong(u, state.arenaRadius);
  disc.pos.x = u.x * r; disc.pos.y = u.y * r; disc.vel.x = 0; disc.vel.y = 0;
}

function onEvents(events) {
  for (const e of events) {
    if (e.kind === 'push' || e.kind === 'ghostPush')
      fx.rings.push({ pos: { ...e.pos }, t0: performance.now(), color: '#f5f2e8', dur: 220 });
    else if (e.kind === 'clash') {
      fx.rings.push({ pos: { ...e.pos }, t0: performance.now(), color: '#4dd8ff', dur: 260 });
      fx.hitstopUntilMs = performance.now() + 60;  // the parry hitstop — makes it *feel* good
      fx.flash = 1;
    }
  }
}

// ---- round / match flow -----------------------------------------------------
function checkRoundEnd() {
  const aliveDiscs = state.discs.filter((d) => d.alive && !d.ghost);
  const timedOut = state.tick - state.roundStartTick >= MAX_ROUND;
  if (aliveDiscs.length <= 1 || timedOut) {
    const winner = aliveDiscs.length === 1 ? aliveDiscs[0].id : -1;
    if (winner >= 0) match.scores[winner]++;
    lastWinner = winner;
    if (winner >= 0 && match.scores[winner] >= TUNING.match.scoreToWin) {
      phase = 'match_end';
    } else {
      phase = 'round_end';
      roundEndAtMs = performance.now() + TUNING.round.endFreeze;
    }
  }
}

// ---- main loop (fixed 60Hz accumulator) ------------------------------------
let acc = 0, lastMs = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dtMs = now - lastMs; lastMs = now;
  if (dtMs > 250) dtMs = 250;

  const frozen = now < fx.hitstopUntilMs;
  if (phase === 'playing' && !frozen) {
    acc += dtMs;
    while (acc >= 1000 / TICK_RATE) {
      onEvents(step());
      acc -= 1000 / TICK_RATE;
      checkRoundEnd();
      if (phase !== 'playing') break;
    }
  } else {
    acc = 0;
  }

  if (phase === 'countdown' && now >= countdownEndsMs) {
    phase = 'playing'; state.roundStartTick = state.tick; lastMs = now; acc = 0;
  }
  if (phase === 'round_end' && now >= roundEndAtMs) {
    match.roundIndex++;
    startRound();
  }
  if (phase === 'match_end') showMatchEnd();

  render(now);
}

// ---- input ------------------------------------------------------------------
const held = new Set();
addEventListener('keydown', (e) => {
  if (['Space', 'Slash', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  held.add(e.code);
});
addEventListener('keyup', (e) => held.delete(e.code));
function pollInputs() {
  if (!inputs.length) return;
  for (let i = 0; i < inputs.length; i++) {
    const k = KEYMAP[i]; const inp = inputs[i];
    let x = 0, y = 0;
    if (held.has(k.left)) x -= 1; if (held.has(k.right)) x += 1;
    if (held.has(k.up)) y -= 1; if (held.has(k.down)) y += 1;
    inp.dir.x = x; inp.dir.y = y;
    inp.push = held.has(k.push); inp.reflect = held.has(k.reflect);
  }
}
setInterval(pollInputs, 1000 / 60);

// ---- rendering --------------------------------------------------------------
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, scale = 1, cx = 0, cy = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const margin = 90;
  scale = Math.min(W, H - margin) / (TUNING.arena.startRadius * 2.15);
  cx = W / 2; cy = (H + margin * 0.4) / 2;
}
addEventListener('resize', resize); resize();

function toScreen(p) { return { x: cx + p.x * scale, y: cy + p.y * scale }; }
function octPath(r) {
  const vs = vertices(r); ctx.beginPath();
  for (let i = 0; i < vs.length; i++) {
    const s = toScreen(vs[i]);
    if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
  }
  ctx.closePath();
}

function render(now) {
  ctx.fillStyle = '#0d0b0f'; ctx.fillRect(0, 0, W, H);
  if (!state) return;
  const r = state.arenaRadius;

  // Signature: the chalk outline that WAS there, fading as the floor is eaten.
  const startR = TUNING.arena.startRadius;
  if (r < startR - 1) {
    octPath(startR);
    ctx.strokeStyle = 'rgba(245,242,232,0.06)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // The living floor (tatame), with the void beyond it.
  octPath(r);
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#1c1a24'; ctx.fillRect(0, 0, W, H);
  // subtle centre marking
  ctx.strokeStyle = 'rgba(245,242,232,0.05)'; ctx.lineWidth = 1;
  octPath(r * 0.5); ctx.stroke();
  ctx.restore();

  // The advancing danger line. Redder / brighter as the arena gets small.
  const danger = 1 - clamp((r - TUNING.arena.endRadius) / (startR - TUNING.arena.endRadius), 0, 1);
  octPath(r);
  ctx.strokeStyle = '#ff4d2e';
  ctx.lineWidth = 2.5 + danger * 3.5;
  ctx.shadowColor = '#ff4d2e'; ctx.shadowBlur = 8 + danger * 26 + (0.5 + 0.5 * Math.sin(now / 140)) * danger * 10;
  ctx.stroke();
  ctx.shadowBlur = 0;
  // inner chalk marca
  octPath(r);
  ctx.strokeStyle = 'rgba(245,242,232,0.55)'; ctx.lineWidth = 1.5; ctx.stroke();

  // falling (eliminated) discs — they don't explode, they drop.
  for (let i = fx.falls.length - 1; i >= 0; i--) {
    const f = fx.falls[i]; const t = (now - f.t0) / 300;
    if (t >= 1) { fx.falls.splice(i, 1); continue; }
    const px = f.pos.x + f.vel.x * (now - f.t0) / 1000;
    const py = f.pos.y + f.vel.y * (now - f.t0) / 1000;
    const s = toScreen({ x: px, y: py });
    ctx.globalAlpha = 1 - t;
    ctx.beginPath(); ctx.arc(s.x, s.y, D.radius * scale * (1 - t * 0.7), 0, Math.PI * 2);
    ctx.fillStyle = f.color; ctx.fill();
    ctx.globalAlpha = 1;
  }

  // discs
  for (const disc of state.discs) drawDisc(disc, now);

  // push / clash rings
  for (let i = fx.rings.length - 1; i >= 0; i--) {
    const ring = fx.rings[i]; const t = (now - ring.t0) / ring.dur;
    if (t >= 1) { fx.rings.splice(i, 1); continue; }
    const s = toScreen(ring.pos);
    ctx.beginPath();
    ctx.arc(s.x, s.y, (D.radius + t * P.range) * scale, 0, Math.PI * 2);
    ctx.strokeStyle = ring.color; ctx.globalAlpha = (1 - t) * 0.9;
    ctx.lineWidth = 3 * (1 - t) + 1; ctx.stroke(); ctx.globalAlpha = 1;
  }

  // parry flash
  if (fx.flash > 0) {
    ctx.fillStyle = `rgba(77,216,255,${fx.flash * 0.14})`; ctx.fillRect(0, 0, W, H);
    fx.flash = Math.max(0, fx.flash - 0.08);
  }

  drawHud(now);
}

function drawDisc(disc, now) {
  if (!disc.alive) return;
  const s = toScreen(disc.pos); const rad = D.radius * scale;
  const color = COLORS[disc.id];
  if (disc.ghost) {
    ctx.beginPath(); ctx.arc(s.x, s.y, rad * 0.8, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.globalAlpha = 0.28; ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
    return;
  }
  // reflect active -> cyan halo; recovery -> red vulnerable tint
  if (disc.reflectState === 'active') {
    ctx.beginPath(); ctx.arc(s.x, s.y, rad + 7, 0, Math.PI * 2);
    ctx.strokeStyle = '#4dd8ff'; ctx.lineWidth = 4;
    ctx.shadowColor = '#4dd8ff'; ctx.shadowBlur = 16; ctx.stroke(); ctx.shadowBlur = 0;
  } else if (disc.reflectState === 'recovery') {
    ctx.beginPath(); ctx.arc(s.x, s.y, rad + 5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,77,46,0.7)'; ctx.lineWidth = 3;
    ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
  }
  // body: flat circle, thick dark border
  ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#0d0b0f'; ctx.stroke();

  // cooldown rings (legible in peripheral vision — colour & shape, not numbers)
  const tick = state.tick;
  const pushReady = tick >= disc.pushCooldownUntil;
  if (!pushReady) {
    const frac = clamp((disc.pushCooldownUntil - tick) / PUSH_CD, 0, 1);
    arc(s.x, s.y, rad + 3, -Math.PI / 2, -Math.PI / 2 + (1 - frac) * Math.PI * 2, '#f5f2e8', 2.5);
  }
}
function arc(x, y, r, a0, a1, color, w) {
  ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}

function drawHud(now) {
  // scoreboard strip
  ctx.font = "700 15px 'Archivo Black', system-ui, sans-serif";
  ctx.textBaseline = 'middle';
  const n = match.playerCount; const gap = 150; const total = (n - 1) * gap;
  let x = W / 2 - total / 2;
  for (let i = 0; i < n; i++) {
    ctx.textAlign = 'center';
    const alive = state.discs[i] && state.discs[i].alive && !state.discs[i].ghost;
    ctx.globalAlpha = alive ? 1 : 0.4;
    ctx.beginPath(); ctx.arc(x - 40, 26, 7, 0, Math.PI * 2); ctx.fillStyle = COLORS[i]; ctx.fill();
    ctx.fillStyle = '#f5f2e8'; ctx.textAlign = 'left';
    ctx.fillText(`${NAMES[i]}  ${match.scores[i]}`, x - 28, 26);
    ctx.globalAlpha = 1;
    x += gap;
  }

  // round timer / countdown
  ctx.textAlign = 'center'; ctx.fillStyle = '#6d6880';
  ctx.font = "600 13px 'JetBrains Mono', monospace";
  if (phase === 'countdown') {
    const left = Math.ceil((countdownEndsMs - now) / 1000);
    ctx.font = "900 90px 'Archivo Black', system-ui, sans-serif";
    ctx.fillStyle = '#f5f2e8';
    ctx.fillText(left > 0 ? String(left) : 'VAI!', W / 2, cy);
  } else if (phase === 'playing') {
    const left = Math.max(0, (MAX_ROUND - (state.tick - state.roundStartTick)) / TICK_RATE);
    ctx.fillText(left.toFixed(1) + 's', W / 2, 50);
  } else if (phase === 'round_end') {
    ctx.font = "900 44px 'Archivo Black', system-ui, sans-serif";
    ctx.fillStyle = lastWinner >= 0 ? COLORS[lastWinner] : '#6d6880';
    ctx.fillText(lastWinner >= 0 ? `${NAMES[lastWinner]} venceu a rodada` : 'Empate', W / 2, cy);
  }
}

// ---- overlay / menu ---------------------------------------------------------
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const msg = document.getElementById('msg');
const keysEl = document.getElementById('keys');
const menuButtons = document.getElementById('menuButtons');
const nextButtons = document.getElementById('nextButtons');

function renderKeyLegend(n) {
  keysEl.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const div = document.createElement('div'); div.className = 'k';
    div.innerHTML = `<span class="swatch" style="background:${COLORS[i]}"></span>
      <span><b>${NAMES[i]}</b> — ${KEYMAP[i].label}</span>`;
    keysEl.appendChild(div);
  }
}
function showOverlay(v) { overlay.style.display = v ? 'flex' : 'none'; }

menuButtons.querySelectorAll('button').forEach((b) =>
  b.addEventListener('click', () => {
    match.playerCount = +b.dataset.n;
    match.scores = Array(match.playerCount).fill(0);
    match.roundIndex = 0;
    startRound();
  }));
document.getElementById('btnNext').addEventListener('click', () => {
  match.playerCount = match.playerCount;
  match.scores = Array(match.playerCount).fill(0);
  match.roundIndex = 0;
  startRound();
});

function showMatchEnd() {
  if (overlay.style.display === 'flex') return;
  showOverlay(true);
  menuButtons.classList.add('hidden'); nextButtons.classList.remove('hidden');
  keysEl.innerHTML = '';
  const w = lastWinner;
  panel.querySelector('h1').innerHTML = `${NAMES[w]}<span class="sub" style="color:${COLORS[w]}">venceu a partida</span>`;
  msg.innerHTML = `Placar final: ${match.scores.map((s, i) => `${NAMES[i]} ${s}`).join(' · ')}`;
}

// initial legend preview (3 players default)
renderKeyLegend(3);
requestAnimationFrame(frame);
</script>
</body>
</html>
